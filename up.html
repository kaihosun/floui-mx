<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Floui Up! · Biblioteca de recursos · floui</title>
  <meta name="description" content="Floui Up! — biblioteca gratuita y premium de guías, workbooks y cursos para que tu negocio fluya.">
  <meta property="og:title" content="Floui Up! · Biblioteca de recursos · floui">
  <meta property="og:description" content="Herramientas digitales para hacer que tu negocio fluya mejor. Guías, workbooks y cursos — gratis y premium.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://floui.mx/up">
  <meta property="og:image" content="https://floui.mx/assets/og-floui.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://floui.mx/assets/og-floui.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- CDN preconnect -->
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://unpkg.com">

  <style>
    :root {
      --floui-soft-dawn:  #FFF6F2;
      --floui-deep-blue:  #3B62AB;
      --floui-dawn-green: #DAE9C6;
      --floui-white:      #FFFFFF;
      --floui-charcoal:   #262626;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; background: var(--floui-charcoal); font-family: 'Inter Tight', -apple-system, system-ui, sans-serif; }
    html { scroll-behavior: smooth; }
    body { color: var(--floui-soft-dawn); -webkit-font-smoothing: antialiased; }

    /* Subtle dotted/noise on dark background */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(color-mix(in srgb, var(--floui-soft-dawn) 3%, transparent) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    #root { position: relative; z-index: 1; }

    /* Scrollbar styling for dark mode */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--floui-charcoal); }
    ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--floui-soft-dawn) 15%, transparent); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--floui-soft-dawn) 25%, transparent); }

    /* ── Responsive — mobile adaptations ── */

    /* Nav */
    .up-nav { padding: 22px 56px; }

    /* Hero */
    .up-hero { padding: 72px 56px 56px; }

    /* Section horizontal padding (FeaturedRow, GridSection, ListSection, NewsletterBlock, Footer) */
    .up-section-pad { padding-left: 56px; padding-right: 56px; }

    /* FilterBar sticky offset matches nav height (~69px desktop) */
    .up-filterbar { padding: 64px 56px 18px; top: 69px; }

    /* FeaturedRow grid: 4 cols desktop */
    .up-featured-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }

    /* Main library grid: 4 cols desktop */
    .up-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }

    /* FilterBar inner chips row: wraps naturally on desktop */
    .up-filterbar-row {
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255,246,242,0.08);
    }
    .up-chips-wrap { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; }

    /* Newsletter grid: 2 cols desktop */
    .up-newsletter-grid {
      display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; align-items: center;
      padding: 56px 48px;
    }

    /* Footer flex row */
    .up-footer-row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 24px; flex-wrap: wrap;
    }

    /* ResourceFan: visible on desktop, hidden on mobile */
    .up-fan { display: block; }

    /* Nav links: visible on desktop */
    .up-nav-links { display: flex; gap: 24px; }

    /* Nav buttons: visible on desktop */
    .up-nav-actions { display: flex; gap: 10px; align-items: center; }

    /* FeaturedRow top padding: large on desktop to clear the fan */
    .up-featured-top { padding-top: 120px; }

    /* FeaturedRow header: space-between on desktop */
    .up-featured-header {
      display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px;
    }

    /* ListSection: full grid on desktop */
    .up-list-row {
      display: grid;
      grid-template-columns: 60px 1.6fr 1fr 0.6fr 0.8fr 0.7fr 100px;
      gap: 18px; padding: 14px 18px; align-items: center;
      cursor: pointer; transition: background .15s;
    }
    .up-list-header {
      display: grid;
      grid-template-columns: 60px 1.6fr 1fr 0.6fr 0.8fr 0.7fr 100px;
      gap: 18px; padding: 12px 18px;
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,246,242,0.45); font-weight: 600;
      border-bottom: 1px solid rgba(255,246,242,0.08);
    }
    /* Columns hidden on mobile — shown on desktop only */
    .up-list-col-topic,
    .up-list-col-format,
    .up-list-col-downloads { display: block; }

    /* Search box full width on mobile, max-width on desktop */
    .up-search-box { max-width: 580px; margin: 40px auto 0; }

    /* Stats row: flex row on desktop */
    .up-stats { display: flex; gap: 24px; justify-content: center; margin-top: 24px; }

    @media (max-width: 768px) {
      /* Nav */
      .up-nav { padding: 14px 20px; }
      .up-nav-links { display: none; } /* collapse nav links on mobile */
      .up-nav-actions .up-btn-login { display: none; } /* hide login, keep subscribe */

      /* Hero */
      .up-hero { padding: 40px 20px 36px; }

      /* Section horizontal padding */
      .up-section-pad { padding-left: 20px; padding-right: 20px; }

      /* FilterBar */
      .up-filterbar { padding: 20px 20px 16px; top: 57px; }
      .up-filterbar-row { flex-direction: column; align-items: stretch; gap: 10px; }
      .up-chips-wrap { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
      .up-chips-wrap::-webkit-scrollbar { display: none; }

      /* Featured grid: 2 cols on mobile */
      .up-featured-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }

      /* Main grid: 2 cols on mobile */
      .up-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }

      /* ResourceFan: hide on mobile (viewport too narrow) */
      .up-fan { display: none; }

      /* FeaturedRow top padding: reduce when fan is hidden */
      .up-featured-top { padding-top: 40px; }

      /* Featured header: stack vertically */
      .up-featured-header { flex-direction: column; gap: 12px; margin-bottom: 16px; }

      /* Newsletter: single column */
      .up-newsletter-grid { grid-template-columns: 1fr; gap: 28px; padding: 32px 24px; }

      /* Footer row: stack */
      .up-footer-row { flex-direction: column; align-items: flex-start; gap: 16px; }

      /* ListSection: card-style rows on mobile */
      .up-list-header { display: none; } /* hide column headers */
      .up-list-row {
        display: flex; flex-direction: row; align-items: center;
        gap: 12px; padding: 12px 16px;
      }
      .up-list-col-topic,
      .up-list-col-format,
      .up-list-col-downloads,
      .up-list-col-price { display: none; }
      /* title cell grows, button stays right */
      .up-list-title { flex: 1; min-width: 0; }
      .up-list-btn { flex-shrink: 0; }

      /* Stats: allow wrap */
      .up-stats { flex-wrap: wrap; gap: 10px 16px; }

      /* Search box: full width with side margins */
      .up-search-box { max-width: 100%; margin: 28px 0 0; }
    }
  </style>

  <noscript>
    <style>
      body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #262626; font-family: system-ui, sans-serif; color: #FFF6F2; text-align: center; padding: 24px; }
    </style>
    <p>Esta página necesita JavaScript activo.<br>Mientras tanto, escríbenos a <a href="mailto:hola@floui.mx" style="color:#DAE9C6;">hola@floui.mx</a></p>
  </noscript>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="up.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <LeadProvider>
          <FlouiUp />
        </LeadProvider>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
