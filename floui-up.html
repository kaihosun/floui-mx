  <!-- CDN preconnect -->
  <link rel="preconnect" href="https://unpkg.com">

  <style>
    :root {
      --floui-soft-dawn:  #FFF6F2;
      --floui-deep-blue:  #3B62AB;
      --floui-dawn-green: #DAE9C6;
      --floui-white:      #FFFFFF;
      --floui-charcoal:   #262626;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; background: var(--floui-charcoal); font-family: 'Inter Tight', -apple-system, system-ui, sans-serif; }
    html { scroll-behavior: smooth; }
    body { color: var(--floui-soft-dawn); -webkit-font-smoothing: antialiased; }

    /* Subtle dotted/noise on dark background */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(color-mix(in srgb, var(--floui-soft-dawn) 3%, transparent) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    #root { position: relative; z-index: 1; }

    /* Scrollbar styling for dark mode */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--floui-charcoal); }
    ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--floui-soft-dawn) 15%, transparent); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--floui-soft-dawn) 25%, transparent); }
  </style>

  <noscript>
    <style>
      body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #262626; font-family: system-ui, sans-serif; color: #FFF6F2; text-align: center; padding: 24px; }
    </style>
    <p>Esta página necesita JavaScript activo.<br>Mientras tanto, escríbenos a <a href="mailto:hola@floui.mx" style="color:#DAE9C6;">hola@floui.mx</a></p>
  </noscript>
</head>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
